<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#212121">
    <title>Chatbot AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell" id="app-shell">
        <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
            <div class="sidebar-header">
                <a class="brand" href="/" aria-label="Chatbot AI beranda">
                    <span class="brand-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M12 3.5 14.5 9.5 20.5 12l-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5 2.5-6Z"/><path d="m19 3 .8 2.2L22 6l-2.2.8L19 9l-.8-2.2L16 6l2.2-.8L19 3Z"/></svg>
                    </span>
                    <span>Chatbot AI</span>
                </a>
                <button class="icon-button sidebar-collapse" id="sidebar-collapse" type="button" aria-label="Tutup menu">
                    <svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M9 4v16"/></svg>
                </button>
            </div>

            <div class="sidebar-content">
                <button class="new-chat-button" id="new-chat-button" type="button">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
                    <span>Obrolan baru</span>
                    <span class="shortcut">Ctrl K</span>
                </button>

                <nav class="sidebar-nav" aria-label="Menu">
                    <button class="nav-item" type="button" id="search-chat-button">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
                        <span>Cari obrolan</span>
                    </button>
                    <button class="nav-item" type="button" id="explore-button">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.8 8.2-2.2 5.4-5.4 2.2 2.2-5.4Z"/></svg>
                        <span>Jelajahi</span>
                    </button>
                </nav>

                <section class="history-section" aria-label="Riwayat obrolan">
                    <h2>Terbaru</h2>
                    <p class="history-empty" id="history-empty">Belum ada obrolan</p>
                    <button class="history-item" id="history-item" type="button" hidden></button>
                </section>
            </div>

            <div class="profile-area">
                <div class="profile-avatar" aria-hidden="true">AI</div>
                <div class="profile-copy">
                    <strong>Asisten AI</strong>
                    <span>Siap membantu</span>
                </div>
                <button class="icon-button profile-menu" type="button" aria-label="Menu profil">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
                </button>
            </div>
        </aside>

        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

        <div class="main-panel">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="icon-button mobile-menu-button" id="mobile-menu-button" type="button" aria-label="Buka menu">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                    <span class="topbar-title">Chatbot AI</span>
                    <span class="model-badge">Gratis</span>
                </div>
                <button class="topbar-action" id="topbar-new-chat" type="button" aria-label="Mulai obrolan baru">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    <span>Obrolan baru</span>
                </button>
            </header>

            <main class="main-content" id="main-content">
                <section class="welcome-screen" id="welcome-screen">
                    <div class="welcome-heading">
                        <div class="welcome-mark" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M12 3.5 14.5 9.5 20.5 12l-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5 2.5-6Z"/><path d="m19 3 .8 2.2L22 6l-2.2.8L19 9l-.8-2.2L16 6l2.2-.8L19 3Z"/></svg>
                        </div>
                        <h1>Mulai dari mana?</h1>
                    </div>

                    <form id="chat-form" class="chat-form">
                        <div class="input-wrapper">
                            <button class="composer-tool" type="button" aria-label="Tambah" title="Tambah">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                            </button>
                            <input
                                type="text"
                                id="user-input"
                                placeholder="Tanya apa saja"
                                autocomplete="off"
                                aria-label="Pesan untuk asisten"
                                required
                            >
                            <button class="think-button" type="button" aria-label="Mode berpikir">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4M8.2 14.5A6.5 6.5 0 1 1 15.8 14.5c-.9.7-1.3 1.4-1.5 2.5h-4.6c-.2-1.1-.6-1.8-1.5-2.5Z"/></svg>
                                <span>Berpikir</span>
                            </button>
                            <button type="submit" id="send-btn" class="send-button" aria-label="Kirim pesan">
                                <svg class="send-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                                <span class="btn-text">Kirim</span>
                            </button>
                        </div>
                    </form>

                    <div class="suggestions" aria-label="Contoh pertanyaan">
                        <button class="suggestion" type="button" data-prompt="Bantu saya menulis sesuatu">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
                            <span>Tulis atau edit</span>
                        </button>
                        <button class="suggestion" type="button" data-prompt="Jelaskan topik ini dengan sederhana">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 4.3 1.8c-1.1 1-1.9 1.3-1.9 3"/><path d="M12 17.5h.01"/></svg>
                            <span>Jelaskan sesuatu</span>
                        </button>
                        <button class="suggestion" type="button" data-prompt="Beri saya beberapa ide kreatif">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4M8.2 14.5A6.5 6.5 0 1 1 15.8 14.5c-.9.7-1.3 1.4-1.5 2.5h-4.6c-.2-1.1-.6-1.8-1.5-2.5Z"/></svg>
                            <span>Cari ide</span>
                        </button>
                    </div>
                </section>

                <section class="chat-box" id="chat-box" aria-live="polite" aria-label="Percakapan"></section>
                <p class="disclaimer">Chatbot AI dapat membuat kesalahan. Periksa kembali informasi penting.</p>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
